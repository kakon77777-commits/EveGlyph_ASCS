name: Milestone D Math Sync

on:
  push:
    branches:
      - workbench/milestone-d-native-math

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/milestone-d-native-math
          fetch-depth: 0
      - name: Install verified local Native Math kernel and tests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dmath.b64 <<'B64'

B64
          base64 -d /tmp/dmath.b64 > /tmp/dmath.tgz
          echo '5deffce349b83bcd89bda19a9c10289706176ff839ac77eff307bd6af44fd888  /tmp/dmath.tgz' | sha256sum -c -
          tar -xzf /tmp/dmath.tgz -C .
          node --test packages/ascs-math/test/*.test.mjs
      - name: Commit verified kernel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ascs-math/src packages/ascs-math/test/numeric-model.test.mjs packages/ascs-math/test/semantics.test.mjs packages/ascs-math/test/transform.test.mjs packages/ascs-math/test/adapters.test.mjs packages/ascs-math/test/conformance.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: implement Native Math candidate kernel'
          git push origin HEAD:workbench/milestone-d-native-math
