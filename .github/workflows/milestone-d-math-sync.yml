name: Milestone D Math Sync

on:
  push:
    branches:
      - workbench/milestone-d-native-math

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/milestone-d-native-math
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Retrieve verified Native Math kernel payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          url = 'https://api.github.com/repos/kakon77777-commits/EveGlyph_ASCS/git/blobs/74bb7ea6d356c6994fcfe998312e273f2df459b8'
          request = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          data = base64.b64decode(payload['content'])
          open('/tmp/dmath.tgz', 'wb').write(data)
          PY
          echo '5deffce349b83bcd89bda19a9c10289706176ff839ac77eff307bd6af44fd888  /tmp/dmath.tgz' | sha256sum -c -
          tar -xzf /tmp/dmath.tgz -C .
          node --test packages/ascs-math/test/*.test.mjs

      - name: Commit verified kernel only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ascs-math/src \
            packages/ascs-math/test/numeric-model.test.mjs \
            packages/ascs-math/test/semantics.test.mjs \
            packages/ascs-math/test/transform.test.mjs \
            packages/ascs-math/test/adapters.test.mjs \
            packages/ascs-math/test/conformance.test.mjs
          if git diff --cached --quiet; then
            echo 'No kernel changes.'
            exit 0
          fi
          git commit -m 'feat: implement Native Math candidate kernel'
          git push origin HEAD:workbench/milestone-d-native-math
