name: Milestone D Glyph Close Metadata

on:
  push:
    branches:
      - workbench/milestone-d-native-glyph

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/milestone-d-native-glyph
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Advance Native Glyph parity metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/product_convergence.py')
          s=p.read_text(encoding='utf-8')
          old='''        "ascs_only_future_milestones": [\n            "native_glyph",\n            "agent_mcp_authority_rebinding",\n        ],'''
          new='''        "ascs_only_future_milestones": [\n            "agent_mcp_authority_rebinding",\n        ],'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''            "native_math_editor_bridge": (root / "test" / "ascs-native-math-bridge.test.mjs").exists(),\n'''
          new2=old2+'''            "native_glyph_candidate_runtime": (repo / "packages" / "ascs-glyph" / "src" / "index.mjs").exists(),\n            "native_glyph_editor_bridge": (root / "test" / "ascs-native-glyph-bridge.test.mjs").exists(),\n'''
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -B -m unittest tests.test_product_convergence -v
          python -B tools/product_convergence.py verify --repo . --json
          python -B tools/product_convergence.py parity --repo . --json
      - name: Commit verified parity metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/product_convergence.py
          git commit -m 'docs: advance parity through Native Glyph'
          git push origin HEAD:workbench/milestone-d-native-glyph
