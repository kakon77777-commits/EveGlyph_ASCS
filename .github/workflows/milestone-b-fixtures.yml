name: Milestone B TW-01 Fixtures

on:
  push:
    branches:
      - workbench/milestone-b-canonical-spine

permissions:
  contents: write

jobs:
  materialize-tw01-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: workbench/milestone-b-canonical-spine
          fetch-depth: 0

      - name: Materialize exact fixture bytes from pinned Architecture archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='canonical/v1.0/source_archives/EveGlyph_Addressable_Symbolic_Computational_Space_Series_v0.1_Architecture_Complete.zip'
          EXPECTED='19a510cebcbe1d1b0e7c3134d99c88eebf98dd20385863ba71850aaf09ca7778'
          ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

          python - <<'PY'
          import hashlib, json, pathlib, zipfile

          archive = pathlib.Path('canonical/v1.0/source_archives/EveGlyph_Addressable_Symbolic_Computational_Space_Series_v0.1_Architecture_Complete.zip')
          out = pathlib.Path('packages/ascs-core/test/fixtures')
          out.mkdir(parents=True, exist_ok=True)
          prefix = 'EveGlyph_Addressable_Symbolic_Computational_Space_Series_v0.1/TW-01_Support/'
          mapping = {
              prefix + 'examples/minimal_workspace.egir.json': out / 'minimal_workspace.egir.json',
              prefix + 'conformance/tw01_vectors.json': out / 'tw01_vectors.json',
          }
          with zipfile.ZipFile(archive) as zf:
              assert zf.testzip() is None
              for source, target in mapping.items():
                  target.write_bytes(zf.read(source))

          hashes = {target.name: hashlib.sha256(target.read_bytes()).hexdigest() for target in mapping.values()}
          expected = {
              'minimal_workspace.egir.json': '0d9cb28fc8c6f9d6e56c99729b14ce9cf873afe7e0f09940298e8ba459f9b78e',
              'tw01_vectors.json': '9043e8002069fc294c125379964d984f0110f27cbf0c500fb1691243dddbe16a',
          }
          assert hashes == expected, (hashes, expected)
          lineage = {
              'schema': 'eveglyph-ascs-reference-fixture/1.0',
              'architecture_archive_sha256': '19a510cebcbe1d1b0e7c3134d99c88eebf98dd20385863ba71850aaf09ca7778',
              'minimal_workspace_sha256': expected['minimal_workspace.egir.json'],
              'tw01_vectors_sha256': expected['tw01_vectors.json'],
          }
          (out / 'REFERENCE_LINEAGE.json').write_text(json.dumps(lineage, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit fixtures if changed
        shell: bash
        run: |
          set -euo pipefail
          git add packages/ascs-core/test/fixtures
          if git diff --cached --quiet; then
            echo 'TW-01 fixture snapshot already matches the pinned archive.'
            exit 0
          fi
          git config user.name 'EveGlyph ASCS Milestone B Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'data: pin TW-01 canonical test fixtures'
          git push origin HEAD:workbench/milestone-b-canonical-spine
