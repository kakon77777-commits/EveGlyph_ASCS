name: Milestone B Wire Editor Bridge

on:
  push:
    branches:
      - workbench/milestone-b-canonical-spine

permissions:
  contents: write

jobs:
  wire-editor-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: workbench/milestone-b-canonical-spine
          fetch-depth: 0
      - name: Add hidden ASCS registration import idempotently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/eveglyph-editor/src/main.js')
          text = path.read_text(encoding='utf-8')
          needle = "import { previewUpdate } from './preview.js'\n"
          insert = needle + "import './ascs/register.js'\n"
          if "import './ascs/register.js'" not in text:
              if needle not in text:
                  raise SystemExit('expected main.js import anchor not found')
              text = text.replace(needle, insert, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Commit bridge wiring if changed
        shell: bash
        run: |
          set -euo pipefail
          git add apps/eveglyph-editor/src/main.js
          if git diff --cached --quiet; then
            echo 'Editor bridge wiring already present.'
            exit 0
          fi
          git config user.name 'EveGlyph ASCS Milestone B Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: register hidden ASCS bridge in EveGlyph Editor'
          git push origin HEAD:workbench/milestone-b-canonical-spine
