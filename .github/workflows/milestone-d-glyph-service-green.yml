name: Milestone D Glyph Service GREEN

on:
  push:
    branches:
      - workbench/milestone-d-native-glyph

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/milestone-d-native-glyph
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retrieve verified service payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          url='https://api.github.com/repos/kakon77777-commits/EveGlyph_ASCS/git/blobs/437a3bf983eb70d73f9cb9162faa0459d8ad764f'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as r: payload=json.load(r)
          open('/tmp/dglyph-service.tgz','wb').write(base64.b64decode(payload['content']))
          PY
          echo '9235c8bfdd3c1826de145a86e367f683b6d97ebccb912b4a2795d7e7dc7221d7  /tmp/dglyph-service.tgz' | sha256sum -c -
          tar -xzf /tmp/dglyph-service.tgz -C .
          node --test packages/ascs-glyph/test/*.test.mjs
          cd apps/eveglyph-editor
          node --test test/ascs-runtime-bridge.test.mjs test/ascs-persistent-bridge.test.mjs test/ascs-native-math-bridge.test.mjs test/ascs-native-glyph-bridge.test.mjs
          npm ci
          npm run build
      - name: Commit verified service production only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ascs-glyph/src/service.mjs packages/ascs-glyph/src/index.mjs apps/eveglyph-editor/src/ascs/runtime-bridge.js apps/eveglyph-editor/src/ascs/register.js
          git commit -m 'feat: bridge Native Glyph through ASCS authority runtime'
          git push origin HEAD:workbench/milestone-d-native-glyph
