name: Milestone D Math Materialize

on:
  push:
    branches:
      - workbench/milestone-d-native-math

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/milestone-d-native-math
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize exact v0.5 fixtures and RED contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('.')
          archive = root / 'canonical/v1.0/source_archives/EveGlyph_ASCS_v0.5_Native_Math_Round_Complete.zip'
          expected = '16f499d1721191ebf11c11baada3440332e5ddbcafa59cc26c7aecc7fe0edebe'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)
          temp = pathlib.Path('/tmp/v05')
          with zipfile.ZipFile(archive) as zf:
              assert zf.testzip() is None
              zf.extractall(temp)
          support = temp / 'EveGlyph_ASCS_v0.5_Native_Math_Round_Complete/EveGlyph_ASCS_v1.0_Roadmap/v0.5/V0.5_Support'
          fixtures = root / 'packages/ascs-math/test/fixtures'
          fixtures.mkdir(parents=True, exist_ok=True)
          mapping = {
              'schemas/native-math-object-v1-candidate.schema.json': 'native-math-object-v1-candidate.schema.json',
              'schemas/math-transform-evidence.schema.json': 'math-transform-evidence.schema.json',
              'schemas/math-conformance-vectors.schema.json': 'math-conformance-vectors.schema.json',
              'conformance/native_math_conformance_vectors.json': 'native_math_conformance_vectors.json',
              'examples/native_math_integral_example.json': 'native_math_integral_example.json',
              'examples/math_transform_example.json': 'math_transform_example.json',
              'examples/math_equality_example.json': 'math_equality_example.json',
              'examples/math_adapter_fidelity_example.json': 'math_adapter_fidelity_example.json',
          }
          rows=[]
          for src, dst in mapping.items():
              data=(support/src).read_bytes()
              (fixtures/dst).write_bytes(data)
              rows.append({'path':dst,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          rows.sort(key=lambda x:x['path'])
          lineage={
              'schema':'eveglyph-ascs-milestone-d-math-lineage/1.0',
              'base_main_sha':'08133a2b794e242723c4c3f6618de2a8d78ad84f',
              'design_commit':'e942a0bc1fec2838579ffcdddddc8bafffb7d30d',
              'archive':'EveGlyph_ASCS_v0.5_Native_Math_Round_Complete.zip',
              'archive_sha256':expected,
              'candidate_profile':'ncm/1.0-candidate.1',
              'vector_profile':'org.evemisslab.math-conformance-vectors/0.1',
              'vector_count':30,
              'fixtures':rows,
          }
          (root/'packages/MILESTONE_D_MATH_REFERENCE_LINEAGE.json').write_text(json.dumps(lineage,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          pkg=root/'packages/ascs-math/package.json'
          pkg.parent.mkdir(parents=True,exist_ok=True)
          pkg.write_text('''{\n  "name": "@evemisslab/ascs-math",\n  "version": "0.1.0-candidate.1",\n  "private": true,\n  "type": "module"\n}\n''',encoding='utf-8')
          test=root/'packages/ascs-math/test/red-contracts.test.mjs'
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text(r'''import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport fs from 'node:fs'\nimport path from 'node:path'\nimport { fileURLToPath } from 'node:url'\n\nimport {\n  validateNativeMathObject,\n  executeMathConformanceVector,\n  projectNativeMathToLatex,\n  projectNativeMathToMathML,\n} from '../src/index.mjs'\n\nconst here = path.dirname(fileURLToPath(import.meta.url))\nconst fixture = (name) => JSON.parse(fs.readFileSync(path.join(here, 'fixtures', name), 'utf8'))\n\ntest('frozen v0.5 Native Math fixture set is exactly 30 unique vectors', () => {\n  const vectors = fixture('native_math_conformance_vectors.json')\n  assert.equal(vectors.profile, 'org.evemisslab.math-conformance-vectors/0.1')\n  assert.equal(vectors.vectors.length, 30)\n  assert.equal(new Set(vectors.vectors.map((item) => item.id)).size, 30)\n})\n\ntest('Native Math public APIs validate, execute vectors, and project without source authority', () => {\n  const example = fixture('native_math_integral_example.json')\n  assert.equal(validateNativeMathObject(example).ok, true)\n  const vector = fixture('native_math_conformance_vectors.json').vectors[0]\n  assert.deepEqual(executeMathConformanceVector(vector), vector.expected)\n  assert.equal(typeof projectNativeMathToLatex(example).source, 'string')\n  assert.equal(typeof projectNativeMathToMathML(example).source, 'string')\n})\n''',encoding='utf-8')
          workflow=root/'.github/workflows/milestone-d-native-math.yml'
          workflow.write_text(r'''name: Milestone D Native Math\n\non:\n  pull_request:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  canonical-preservation:\n    if: github.event.pull_request.head.ref == 'workbench/milestone-d-native-math'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.13'\n      - run: python -m pip install 'jsonschema>=4,<5' 'brotli>=1.1'\n      - run: python -B tools/ascs_repo.py verify --repo . --json\n      - run: python -B canonical/v1.0/machine/tests/test_validate_v10.py\n      - run: python -B canonical/v1.0/machine/tools/validate_v10.py --json\n      - run: python -B -m unittest tests.test_product_convergence -v\n      - run: python -B tools/product_convergence.py verify --repo . --json\n\n  v05-reference:\n    if: github.event.pull_request.head.ref == 'workbench/milestone-d-native-math'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.13'\n      - run: python -m pip install 'jsonschema>=4,<5'\n      - name: Verify pinned archive and v0.5 reference\n        shell: bash\n        run: |\n          set -euo pipefail\n          python - <<'PY2'\n          import hashlib, pathlib, zipfile\n          archive = pathlib.Path('canonical/v1.0/source_archives/EveGlyph_ASCS_v0.5_Native_Math_Round_Complete.zip')\n          expected = '16f499d1721191ebf11c11baada3440332e5ddbcafa59cc26c7aecc7fe0edebe'\n          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected\n          out = pathlib.Path('/tmp/v05')\n          with zipfile.ZipFile(archive) as zf:\n              assert zf.testzip() is None\n              zf.extractall(out)\n          PY2\n          V05=/tmp/v05/EveGlyph_ASCS_v0.5_Native_Math_Round_Complete/EveGlyph_ASCS_v1.0_Roadmap/v0.5\n          python -B "$V05/V0.5_Support/tools/validate_v05.py" --json\n          python - <<'PY2'\n          import hashlib, json\n          from pathlib import Path\n          import jsonschema\n          root = Path('packages/ascs-math/test/fixtures')\n          pins = json.loads(Path('packages/MILESTONE_D_MATH_REFERENCE_LINEAGE.json').read_text())\n          for row in pins['fixtures']:\n              p = root / row['path']\n              assert len(p.read_bytes()) == row['bytes']\n              assert hashlib.sha256(p.read_bytes()).hexdigest() == row['sha256']\n          schema = json.loads((root/'math-conformance-vectors.schema.json').read_text())\n          vectors = json.loads((root/'native_math_conformance_vectors.json').read_text())\n          jsonschema.Draft202012Validator(schema).validate(vectors)\n          assert len(vectors['vectors']) == 30\n          print('Milestone D Math frozen fixtures: PASS')\n          PY2\n\n  javascript-native-math:\n    if: github.event.pull_request.head.ref == 'workbench/milestone-d-native-math'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n      - run: node --test packages/ascs-math/test/*.test.mjs\n\n  regression-product:\n    if: github.event.pull_request.head.ref == 'workbench/milestone-d-native-math'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n          cache: npm\n          cache-dependency-path: apps/eveglyph-editor/package-lock.json\n      - name: ASCS B/C regressions\n        run: node --test packages/ascs-core/test/*.test.mjs packages/ascs-runtime/test/*.test.mjs packages/ascs-store/test/*.test.mjs packages/ascs-history/test/*.test.mjs packages/ascs-spatial/test/*.test.mjs\n      - name: EveGlyph current product\n        working-directory: apps/eveglyph-editor\n        shell: bash\n        run: |\n          set -euo pipefail\n          npm ci\n          node --test test/ascs-runtime-bridge.test.mjs\n          node --test test/ascs-persistent-bridge.test.mjs\n          npm run test:publication\n          npm run build\n          npm run verify:dynamic-logic\n          npm run verify:dynamic-rendering\n''',encoding='utf-8')
          print(json.dumps({'fixtures':len(rows),'vector_count':30,'archive_sha256':expected},indent=2))
          PY
      - name: Commit materialized RED baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ascs-math packages/MILESTONE_D_MATH_REFERENCE_LINEAGE.json .github/workflows/milestone-d-native-math.yml
          if git diff --cached --quiet; then
            echo 'No materialization changes.'
            exit 0
          fi
          git commit -m 'test: define Native Math candidate contracts'
          git push origin HEAD:workbench/milestone-d-native-math
