name: Milestone D Glyph Kernel Sync

on:
  push:
    branches:
      - workbench/milestone-d-native-glyph

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/milestone-d-native-glyph
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retrieve verified Native Glyph kernel payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          url='https://api.github.com/repos/kakon77777-commits/EveGlyph_ASCS/git/blobs/3401d39631821fa4f76f19dd50d0e82e841895eb'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as r: payload=json.load(r)
          open('/tmp/dglyph-kernel.tgz','wb').write(base64.b64decode(payload['content']))
          PY
          echo '8b820b39931e4aa2f78b5874d7f7e1576502a1b1d32aba03c47d497cbe924190  /tmp/dglyph-kernel.tgz' | sha256sum -c -
          tar -xzf /tmp/dglyph-kernel.tgz -C .
          node --test packages/ascs-glyph/test/*.test.mjs
      - name: Commit verified kernel only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ascs-glyph/src packages/ascs-glyph/test/*.test.mjs
          git commit -m 'feat: implement Native Glyph candidate kernel'
          git push origin HEAD:workbench/milestone-d-native-glyph
