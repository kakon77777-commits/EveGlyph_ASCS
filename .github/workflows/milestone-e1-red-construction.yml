name: Milestone E1 Construction

on:
  push:
    branches: [workbench/milestone-e1-agent-kernel]

permissions:
  contents: read

jobs:
  construction-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose exact completed source bytes
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = {
            'packages/ascs-agent/src/model.mjs': 'ece5a870c9005d7330509c132c91af135683ea93d57ed972c5586ccaa57a096e',
            'packages/ascs-agent/src/context.mjs': 'a11618c49ced566d3141ebc20b02cb2e714ae00dd043884c080b939389fe5d3f',
            'packages/ascs-agent/src/run.mjs': '88aa13064d42acd9e7a752e7e23e234d7fdc38708443caa7beb662f8d32fe3a3',
            'packages/ascs-agent/src/proposal.mjs': '461fb6dbb9ab8ca74317427a421507df8ff694ba8b96364271054ca37015d59f',
            'packages/ascs-agent/src/review.mjs': 'b3d06d54c277874096865fa66f41ab70246b3fa1df9f4d8e2c2ef6d4a63e4000',
            'packages/ascs-agent/src/kernel.mjs': 'c32ade368fd5e78ed157526569ebc30b6e4b82097d28b85a7c0fbe4083c1a9ad',
            'packages/ascs-agent/src/conformance.mjs': '971ca8f2593a78783d49257838e31b66633fe2df8d7fad003e195241208e3003',
            'packages/ascs-agent/src/index.mjs': 'c89151f54becbdc0e98da4ed5381640510b24603101bf0b39315ccc614ccea79',
          }
          mismatches = []
          for path, want in expected.items():
              got = sha256(Path(path).read_bytes()).hexdigest()
              status = 'PASS' if got == want else 'MISMATCH'
              print(f'{status} {path} actual={got} expected={want}')
              if got != want:
                  mismatches.append(path)
          print(f'SOURCE_BYTE_MISMATCH_COUNT={len(mismatches)}')
          PY
      - name: Verify Task 2 contracts
        run: |
          node --test packages/ascs-agent/test/model.test.mjs packages/ascs-agent/test/reference-lineage.test.mjs
          python -B -m unittest tests.test_e1_agent_reference -v
      - name: Verify Task 3 context and run contracts
        run: node --test packages/ascs-agent/test/context.test.mjs packages/ascs-agent/test/run.test.mjs
      - name: Verify Task 4 proposal and review contracts
        run: node --test packages/ascs-agent/test/proposal.test.mjs packages/ascs-agent/test/review.test.mjs
      - name: Verify Task 5 AgentKernel and no-authority contracts
        run: node --test packages/ascs-agent/test/kernel.test.mjs packages/ascs-agent/test/no-runtime-authority.test.mjs
      - name: Diagnose Task 6 production conformance dispatcher
        run: node --test packages/ascs-agent/test/conformance.test.mjs
