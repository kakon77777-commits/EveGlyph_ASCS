name: Milestone E1 RED Construction

on:
  push:
    branches: [workbench/milestone-e1-agent-kernel]

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: E1 contract should be RED before production implementation
        run: |
          node --test packages/ascs-agent/test/kernel.test.mjs
          python -B -m unittest tests.test_e1_agent_reference -v
