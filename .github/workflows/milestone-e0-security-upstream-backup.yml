name: Milestone E0 Security Upstream Backup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-head-source-backup:
    if: github.event.pull_request.head.ref == 'workbench/milestone-e0-security-upstream' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/eveglyph-editor/package-lock.json

      - name: Install validator dependencies
        run: python -m pip install 'jsonschema>=4,<5' 'brotli>=1.1'

      - name: Verify exact head and ASCS reference contracts
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python -B tools/ascs_repo.py verify --repo . --json
          python -B canonical/v1.0/machine/tests/test_validate_v10.py
          python -B canonical/v1.0/machine/tools/validate_v10.py --json
          python -B -m unittest tests.test_security_upstream tests.test_product_convergence -v
          python -B tools/security_upstream.py verify-manifest --repo . --json
          python -B tools/product_convergence.py verify --repo . --json
          python -B tools/product_convergence.py parity --repo . --json

      - name: Verify exact pinned security upstream identity and runnable contract
        shell: bash
        run: |
          set -euo pipefail
          UP=/tmp/eveglyph-security-upstream
          rm -rf "$UP"
          git init "$UP"
          git -C "$UP" remote add origin https://github.com/kakon77777-commits/eveglyph-editor.git
          git -C "$UP" fetch --depth=2 origin 061a57ebd3f86dd6df83e6ff8472f5e194c567e5
          git -C "$UP" checkout --detach FETCH_HEAD
          python -B tools/security_upstream.py verify-checkout --repo . --upstream-checkout "$UP" --json
          cd "$UP"
          npm ci
          npm run test:capabilities
          npm run test:credential-broker
          npm run test:github-connector
          npm run test:google-connector
          npm run test:mcp-delegation
          npm run test:publication
          npm run build
          npm run verify:dynamic-logic
          npm run verify:dynamic-rendering

      - name: Verify ASCS A/B/C/D runtime
        shell: bash
        run: |
          set -euo pipefail
          node --test packages/ascs-core/test/*.test.mjs packages/ascs-runtime/test/*.test.mjs packages/ascs-store/test/*.test.mjs packages/ascs-history/test/*.test.mjs packages/ascs-spatial/test/*.test.mjs
          node --test packages/ascs-math/test/*.test.mjs
          node --test packages/ascs-glyph/test/*.test.mjs

      - name: Verify current EveGlyph ASCS product surface
        working-directory: apps/eveglyph-editor
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test test/ascs-runtime-bridge.test.mjs test/ascs-persistent-bridge.test.mjs test/ascs-native-math-bridge.test.mjs test/ascs-native-glyph-bridge.test.mjs
          npm run test:publication
          npm run build
          npm run verify:dynamic-logic
          npm run verify:dynamic-rendering

      - name: Build exact-head source backup
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: 3590b11b6d1304292181394034d9c4114ec777f9
          REPOSITORY: kakon77777-commits/EveGlyph_ASCS
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          SHA8="${HEAD_SHA:0:8}"
          OUT="$RUNNER_TEMP/ascs-e0-backup-output"
          PKG="$RUNNER_TEMP/EveGlyph_ASCS_Milestone_E0_${SHA8}_source-backup"
          ZIP="$OUT/EveGlyph_ASCS_Milestone_E0_${SHA8}_source-backup.zip"
          rm -rf "$OUT" "$PKG"
          mkdir -p "$OUT" "$PKG/repository"

          rsync -a ./ "$PKG/repository/" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='tmp/' \
            --exclude='.cache/' \
            --exclude='coverage/' \
            --exclude='.DS_Store'

          git diff --binary "$BASE_SHA...$HEAD_SHA" > "$PKG/PR.patch"

          python - "$PKG" "$ZIP" "$REPOSITORY" "$BASE_SHA" "$HEAD_SHA" "$PR_NUMBER" <<'PY'
          import hashlib, json, sys, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          pkg = Path(sys.argv[1]); zip_path = Path(sys.argv[2])
          repository, base_sha, head_sha, pr_number = sys.argv[3:]
          snapshot = pkg / 'repository'
          rows=[]
          for path in sorted(p for p in snapshot.rglob('*') if p.is_file()):
              rel=path.relative_to(snapshot).as_posix(); data=path.read_bytes()
              rows.append({'path':rel,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          tree=hashlib.sha256()
          for row in rows:
              tree.update(f'{row["path"]}\0{row["sha256"]}\0{row["bytes"]}\0'.encode('utf-8'))
          manifest={
              'schema':'eveglyph-ascs-source-backup/1.0',
              'repository':repository,
              'milestone':'E0-security-upstream-freeze',
              'branch':'workbench/milestone-e0-security-upstream',
              'pr_number':int(pr_number),
              'base_sha':base_sha,
              'head_sha':head_sha,
              'design_commit':'dec29c38eb75ba203e3824dd8e18918e93ea1403',
              'ascs_canonical_release':'ascs/1.0',
              'historical_product_baseline_commit':'c3258a2f461d5af5a69c879891b485ccf0f02635',
              'security_upstream_repository':'kakon77777-commits/eveglyph-editor',
              'security_upstream_commit':'061a57ebd3f86dd6df83e6ff8472f5e194c567e5',
              'security_upstream_tree':'664934916c950303ad7e9d166f7aa36a07ac4c57',
              'security_upstream_selected_files':34,
              'security_upstream_reviewed_fixes':7,
              'created_at':datetime.now(timezone.utc).isoformat(),
              'snapshot_root':'repository/',
              'snapshot_file_count':len(rows),
              'snapshot_total_bytes':sum(row['bytes'] for row in rows),
              'payload_tree_sha256':tree.hexdigest(),
              'exclusions':['.git','node_modules','dist','tmp','.cache','coverage','.DS_Store'],
              'verification':{
                  'exact_head':'PASS',
                  'repository_preservation':'PASS',
                  'ascs_v1_regression':'PASS',
                  'ascs_v1_validator':'PASS',
                  'security_manifest':'PASS',
                  'security_upstream_head_tree_parents':'PASS',
                  'security_upstream_selected_files_34':'PASS',
                  'security_upstream_e0_command_contract':'PASS',
                  'historical_product_lineage':'PASS',
                  'milestone_a_b_c_d_runtime':'PASS',
                  'editor_b_c_d_bridges':'PASS',
                  'publication_tests':'PASS',
                  'build':'PASS',
                  'dynamic_logic':'PASS',
                  'dynamic_rendering':'PASS',
                  'wasmtime_physical_runtime':'DEFERRED_TO_E5'
              }
          }
          (pkg/'BACKUP_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (pkg/'RESTORE.md').write_text(
              '# EveGlyph ASCS Milestone E0 exact-head restore\n\n'
              f'This archive corresponds to PR #{pr_number} head `{head_sha}` with base `{base_sha}`.\n\n'
              '1. Extract the archive.\n2. Use `repository/` as the restored source tree.\n'
              '3. Verify package files with `SHA256SUMS.txt`.\n4. `PR.patch` records the exact E0 delta.\n'
              '5. The security upstream is a pinned implementation reference only; historical product baseline and canonical authority are not replaced.\n',
              encoding='utf-8')
          package_rows=[]
          for path in sorted(p for p in pkg.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt'):
              package_rows.append((hashlib.sha256(path.read_bytes()).hexdigest(),path.relative_to(pkg).as_posix()))
          (pkg/'SHA256SUMS.txt').write_text(''.join(f'{d}  {r}\n' for d,r in package_rows),encoding='utf-8')
          zip_path.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
              for path in sorted(p for p in pkg.rglob('*') if p.is_file()):
                  zf.write(path,f'{pkg.name}/{path.relative_to(pkg).as_posix()}')
          digest=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (zip_path.parent/'ARTIFACT_SHA256.txt').write_text(f'{digest}  {zip_path.name}\n',encoding='utf-8')
          print(json.dumps({'archive':zip_path.name,'sha256':digest,'payload_tree_sha256':tree.hexdigest(),'files':len(rows)},indent=2))
          PY

          python - "$ZIP" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              bad=zf.testzip()
              if bad: raise SystemExit(f'bad zip member: {bad}')
          PY
          (cd "$OUT" && sha256sum -c ARTIFACT_SHA256.txt)

      - name: Upload exact-head backup
        uses: actions/upload-artifact@v4
        with:
          name: EveGlyph_ASCS_Milestone_E0_${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/ascs-e0-backup-output/EveGlyph_ASCS_Milestone_E0_*_source-backup.zip
            ${{ runner.temp }}/ascs-e0-backup-output/ARTIFACT_SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
