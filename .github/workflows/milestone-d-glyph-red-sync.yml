name: Milestone D Glyph RED Sync

on:
  push:
    branches:
      - workbench/milestone-d-native-glyph

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/milestone-d-native-glyph
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retrieve pinned RED payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          url='https://api.github.com/repos/kakon77777-commits/EveGlyph_ASCS/git/blobs/6e247a3029502346471b02755d748c445df95b2e'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req) as r: payload=json.load(r)
          open('/tmp/dglyph-red.tgz','wb').write(base64.b64decode(payload['content']))
          PY
          echo 'c2eaa13e504a120b07071b9cb7ac392f4e487293cfcf9db63dee4c7534b0302a  /tmp/dglyph-red.tgz' | sha256sum -c -
          tar -xzf /tmp/dglyph-red.tgz -C .
      - name: Verify intended RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test packages/ascs-glyph/test/red-contracts.test.mjs > /tmp/red.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'ERR_MODULE_NOT_FOUND' /tmp/red.log
          grep -q 'packages/ascs-glyph/src/index.mjs' /tmp/red.log
      - name: Commit RED data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ascs-glyph packages/MILESTONE_D_GLYPH_REFERENCE_LINEAGE.json
          git commit -m 'test: define Native Glyph candidate contracts'
          git push origin HEAD:workbench/milestone-d-native-glyph
