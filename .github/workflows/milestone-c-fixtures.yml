name: Milestone C Canonical Fixtures

on:
  push:
    branches:
      - workbench/milestone-c-persistence-history-spatial

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: workbench/milestone-c-persistence-history-spatial
          fetch-depth: 0
      - name: Extract exact pinned fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, zipfile
          root=pathlib.Path('canonical/v1.0/source_archives')
          specs=[
            ('EveGlyph_Addressable_Symbolic_Computational_Space_Series_v0.1_Architecture_Complete.zip','19a510cebcbe1d1b0e7c3134d99c88eebf98dd20385863ba71850aaf09ca7778'),
            ('EveGlyph_ASCS_v0.3_Persistent_Editing_Round_Complete.zip','8c3aa6f55ac35ee94b8e8e6846d8ece0543b52f6fe1fc8c90a2c4efb16acacfb'),
            ('EveGlyph_ASCS_v0.4_Spatial_Region_Round_Complete.zip','29dd5cb0d17f75a2dbc727315a4f341551f8223ead6c5605edd4a36e685adce7'),
          ]
          for name,expected in specs:
            actual=hashlib.sha256((root/name).read_bytes()).hexdigest(); assert actual==expected,(name,actual)

          store=pathlib.Path('packages/ascs-store/test/fixtures'); store.mkdir(parents=True,exist_ok=True)
          hist=pathlib.Path('packages/ascs-history/test/fixtures'); hist.mkdir(parents=True,exist_ok=True)
          spat=pathlib.Path('packages/ascs-spatial/test/fixtures'); spat.mkdir(parents=True,exist_ok=True)

          arch=root/specs[0][0]
          with zipfile.ZipFile(arch) as z:
            p='EveGlyph_Addressable_Symbolic_Computational_Space_Series_v0.1/'
            mapping={
              p+'TW-02_Support/conformance/tw02_vectors.json':store/'tw02_vectors.json',
              p+'TW-02_Support/examples/example_store/manifest.json':store/'example_manifest.json',
              p+'TW-02_Support/schemas/eveglyph-storage-manifest.schema.json':store/'egstore.schema.json',
              p+'TW-01_Support/examples/minimal_workspace.egir.json':store/'minimal_workspace.egir.json',
            }
            for src,dst in mapping.items(): dst.write_bytes(z.read(src))

          v3=root/specs[1][0]
          with zipfile.ZipFile(v3) as z:
            base='EveGlyph_ASCS_v0.3_Persistent_Editing_Round_Complete/EveGlyph_ASCS_v1.0_Roadmap/v0.3/V0.3_Support/'
            for src,dst in {
              base+'conformance/history_merge_vectors.json':hist/'history_merge_vectors.json',
              base+'schemas/history-profile.schema.json':hist/'history-profile.schema.json',
            }.items(): dst.write_bytes(z.read(src))

          v4=root/specs[2][0]
          with zipfile.ZipFile(v4) as z:
            base='EveGlyph_ASCS_v0.4_Spatial_Region_Round_Complete/EveGlyph_ASCS_v1.0_Roadmap/v0.4/V0.4_Support/'
            for src,dst in {
              base+'conformance/spatial_conformance_vectors.json':spat/'spatial_conformance_vectors.json',
              base+'schemas/spatial-region-profile.schema.json':spat/'spatial-region-profile.schema.json',
              base+'examples/spatial_region_example.json':spat/'spatial_region_example.json',
            }.items(): dst.write_bytes(z.read(src))

          lineage={
            'schema':'eveglyph-ascs-milestone-c-reference-fixtures/1.0',
            'architecture_archive_sha256':specs[0][1],
            'history_archive_sha256':specs[1][1],
            'spatial_archive_sha256':specs[2][1],
            'tw02_vectors_sha256':'8840e674d4e209357f9244826f669b4fade1095dbf2d184b96ba1e38e9098de3',
            'history_vectors_sha256':'c0afe5c97be7b231764874a4c7466636f1cdcf146796f6af04019e336d777d00',
            'spatial_vectors_sha256':'c35cb6782227cb0010508211b3aab04675c97324202c2cfb2b8638e94af9b940'
          }
          pathlib.Path('packages/MILESTONE_C_REFERENCE_LINEAGE.json').write_text(json.dumps(lineage,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          checks={
            store/'tw02_vectors.json':lineage['tw02_vectors_sha256'],
            hist/'history_merge_vectors.json':lineage['history_vectors_sha256'],
            spat/'spatial_conformance_vectors.json':lineage['spatial_vectors_sha256'],
          }
          for path,expected in checks.items(): assert hashlib.sha256(path.read_bytes()).hexdigest()==expected,(path,expected)
          PY
      - name: Commit fixtures if changed
        shell: bash
        run: |
          set -euo pipefail
          git add packages/ascs-store/test/fixtures packages/ascs-history/test/fixtures packages/ascs-spatial/test/fixtures packages/MILESTONE_C_REFERENCE_LINEAGE.json
          if git diff --cached --quiet; then echo 'Milestone C fixtures already pinned.'; exit 0; fi
          git config user.name 'EveGlyph ASCS Milestone C Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'data: pin Milestone C canonical fixtures'
          git push origin HEAD:workbench/milestone-c-persistence-history-spatial
