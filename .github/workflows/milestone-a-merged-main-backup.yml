name: Milestone A Merged Main Backup

on:
  push:
    branches:
      - ops/milestone-a-merged-main-backup

permissions:
  contents: read

jobs:
  merged-main-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main commit
        uses: actions/checkout@v4
        with:
          ref: 5844692bf00b7650d67fa1fe744ca0f790f9e4b9
          fetch-depth: 0

      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validator dependency
        run: python -m pip install 'jsonschema>=4,<5'

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/eveglyph-editor/package-lock.json

      - name: Verify merged main canonical state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5844692bf00b7650d67fa1fe744ca0f790f9e4b9"
          python -B tools/ascs_repo.py verify --repo . --json
          python -B canonical/v1.0/machine/tests/test_validate_v10.py
          python -B canonical/v1.0/machine/tools/validate_v10.py --json
          python -B -m unittest tests.test_product_convergence -v
          python -B tools/product_convergence.py verify --repo . --json
          python -B tools/product_convergence.py parity --repo . --json

      - name: Verify merged main EveGlyph product surface
        working-directory: apps/eveglyph-editor
        run: |
          set -euo pipefail
          npm ci
          npm run test:publication
          npm run build
          npm run verify:dynamic-logic
          npm run verify:dynamic-rendering

      - name: Build merged-main backup
        env:
          MERGE_SHA: 5844692bf00b7650d67fa1fe744ca0f790f9e4b9
          BASE_PARENT: 24176a9776c941c2f28af1138dd439455ec71de6
          PR_HEAD: 2093e7f8c5af5cc4bae4c41e48dc3db283eb954e
          REPOSITORY: kakon77777-commits/EveGlyph_ASCS
        shell: bash
        run: |
          set -euo pipefail
          SHA8="${MERGE_SHA:0:8}"
          OUT="$RUNNER_TEMP/ascs-merged-main-backup-output"
          PKG="$RUNNER_TEMP/EveGlyph_ASCS_Milestone_A_${SHA8}_merged-main-backup"
          ZIP="$OUT/EveGlyph_ASCS_Milestone_A_${SHA8}_merged-main-backup.zip"
          rm -rf "$OUT" "$PKG"
          mkdir -p "$OUT" "$PKG/repository"

          rsync -a ./ "$PKG/repository/" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='tmp/' \
            --exclude='.cache/' \
            --exclude='coverage/' \
            --exclude='.DS_Store'

          git diff --binary "$BASE_PARENT...$PR_HEAD" > "$PKG/PR1.patch"

          python - "$PKG" "$ZIP" "$REPOSITORY" "$MERGE_SHA" "$BASE_PARENT" "$PR_HEAD" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          pkg = Path(sys.argv[1])
          zip_path = Path(sys.argv[2])
          repository, merge_sha, base_parent, pr_head = sys.argv[3:]
          snapshot = pkg / "repository"

          rows = []
          for path in sorted(p for p in snapshot.rglob("*") if p.is_file()):
              rel = path.relative_to(pkg).as_posix()
              data = path.read_bytes()
              rows.append({"path": rel, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})

          with (pkg / "SHA256SUMS.txt").open("w", encoding="utf-8", newline="\n") as f:
              for row in rows:
                  f.write(f'{row["sha256"]}  {row["path"]}\n')

          tree = hashlib.sha256()
          for row in rows:
              tree.update(f'{row["path"]}\0{row["sha256"]}\0{row["bytes"]}\0'.encode("utf-8"))

          merge_info = {
              "schema": "eveglyph-ascs-merged-main-backup/1.0",
              "repository": repository,
              "milestone": "A-product-baseline-parity",
              "source_branch": "main",
              "merge_sha": merge_sha,
              "merge_parents": [base_parent, pr_head],
              "pr_number": 1,
              "pr_final_head": pr_head,
              "ascs_canonical_release": "ascs/1.0",
              "eveglyph_upstream_sha": "c3258a2f461d5af5a69c879891b485ccf0f02635",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "snapshot_root": "repository/",
              "snapshot_file_count": len(rows),
              "snapshot_total_bytes": sum(r["bytes"] for r in rows),
              "payload_tree_sha256": tree.hexdigest(),
              "exclusions": [".git", "node_modules", "dist", "tmp", ".cache", "coverage", ".DS_Store"],
              "verification": {
                  "exact_merge_sha": "PASS",
                  "repository_preservation": "PASS",
                  "ascs_v1_regression": "PASS",
                  "ascs_v1_validator": "PASS",
                  "product_convergence_tests": "PASS",
                  "vendored_baseline_verify": "PASS",
                  "product_parity": "PASS",
                  "npm_ci": "PASS",
                  "publication_tests": "PASS",
                  "build": "PASS",
                  "dynamic_logic": "PASS",
                  "dynamic_rendering": "PASS"
              }
          }
          (pkg / "MERGE_INFO.json").write_text(json.dumps(merge_info, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (pkg / "BACKUP_MANIFEST.json").write_text(json.dumps(merge_info, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          (pkg / "RESTORE.md").write_text(
              "# EveGlyph ASCS Milestone A merged-main restore\n\n"
              f"This archive is the source snapshot of main at merge commit `{merge_sha}`.\n\n"
              "1. Extract the archive.\n"
              "2. Use `repository/` as the restored source tree.\n"
              "3. Verify payload files with `sha256sum -c SHA256SUMS.txt` from the package root.\n"
              "4. `PR1.patch` records the Milestone A feature delta from the pre-merge base to the PR final head.\n",
              encoding="utf-8"
          )

          zip_path.parent.mkdir(parents=True, exist_ok=True)
          root_name = pkg.name
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(p for p in pkg.rglob("*") if p.is_file()):
                  arcname = f"{root_name}/{path.relative_to(pkg).as_posix()}"
                  zf.write(path, arcname)

          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          (zip_path.parent / "ARTIFACT_SHA256.txt").write_text(f"{digest}  {zip_path.name}\n", encoding="utf-8")
          print(json.dumps({"archive": zip_path.name, "sha256": digest, "payload_tree_sha256": tree.hexdigest(), "files": len(rows)}, indent=2))
          PY

          python - "$ZIP" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"bad zip member: {bad}")
          PY
          (cd "$OUT" && sha256sum -c ARTIFACT_SHA256.txt)

      - name: Upload merged-main backup
        uses: actions/upload-artifact@v4
        with:
          name: EveGlyph_ASCS_Milestone_A_5844692b_merged-main-backup
          path: |
            ${{ runner.temp }}/ascs-merged-main-backup-output/EveGlyph_ASCS_Milestone_A_5844692b_merged-main-backup.zip
            ${{ runner.temp }}/ascs-merged-main-backup-output/ARTIFACT_SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
